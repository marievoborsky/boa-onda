# Hält das kostenlose Supabase-Projekt wach: ohne Zugriffe über 7 Tage pausiert Supabase das Projekt,
# und dann fallen Login, Sync und Kaufprüfung der App aus. Ein Aufruf pro Tag reicht als „Aktivität“.
# Der Schlüssel ist der öffentliche (publishable) Key, der ohnehin in der App steht.
name: Supabase wachhalten
on:
  schedule:
    - cron: "17 6 * * *"   # täglich 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: REST-Endpunkt anfragen
        run: |
          K=sb_publishable_Z7HQppHF-MrGJt3ficWyvA_DTlDGJ8x
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $K" -H "Authorization: Bearer $K" \
            "https://tzyuhwdcjcdyebtajmvu.supabase.co/rest/v1/launch_list?select=id&limit=1")
          echo "Supabase antwortet mit HTTP $code"
          test "$code" = "200"
